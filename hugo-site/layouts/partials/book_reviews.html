{{- with .Params.reviews -}}
<section class="book-reviews" id="reviews">
  <h2>Reviews</h2>
  <ul class="review-list">
    {{- range . }}
    <li>
      <a class="review-link" href="{{ .url }}" target="_blank" rel="noopener noreferrer">
        <span class="review-authors">{{ .authors }}</span>
        <span class="review-source"><em>{{ .venue }}</em>{{ with .details }} {{ . }}{{ end }}</span>
      </a>
    </li>
    {{- end }}
  </ul>
</section>
{{- end -}}
